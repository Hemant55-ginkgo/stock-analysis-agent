name: Checkpoint Validator

on:
  schedule:
    - cron: '30 3 * * 1,3,5'  # Mon, Wed, Fri — catches all checkpoint days
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas python-dotenv

      - name: Run checkpoint validation
        run: python checkpoint_validator.py

      - name: Commit updated log
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add validation_log.json
          git diff --staged --quiet || git commit -m "Checkpoint validation $(date +%Y-%m-%d)"
          git push
name: Weekly Stock Analysis

on:
  schedule:
    - cron: '30 3 * * 0'  # 9:00 AM IST every Sunday
  workflow_dispatch:        # allows manual trigger from GitHub UI

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas python-dotenv anthropic requests

      - name: Run analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python stock_analysis_agent_v2.py

      - name: Commit updated logs
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add validation_log.json news_cache.json
          git diff --staged --quiet || git commit -m "Weekly analysis $(date +%Y-%m-%d)"
          git push